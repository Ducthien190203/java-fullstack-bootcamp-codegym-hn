<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Category</title>
</head>
<body>
<h1>Edit category</h1>
<p>
    <th:if test="${message != null}">
        <span class="message" th:text="${message}"></span>
    </th:if>
</p>
<p>
    <a href="/categories">Back to category list</a>
    | <a href="/blogs">Back to Blog List</a>
</p>
<form th:object="${category}" th:action="@{/categories/edit}" method="post">
    <input type="hidden" th:field="*{id}"/>
    <table>
        <tr>
            <td>Name:</td>
            <td><input type="text" th:field="*{name}"/></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="submit" value="Update category"></td>
        </tr>
    </table>
</form>
</body>
</html>
