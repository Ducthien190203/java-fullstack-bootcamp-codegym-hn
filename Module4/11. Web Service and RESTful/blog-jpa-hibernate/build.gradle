plugins {
    id 'java'
    id 'war'
}

group 'vn.codegym'
version '1.0-SNAPSHOT'
sourceCompatibility = '1.8'

repositories {
    mavenCentral()
}

dependencies {
    // Spring MVC
    implementation 'org.springframework:spring-webmvc:5.3.20'
    implementation 'org.springframework:spring-context:5.3.20'
    implementation 'org.springframework:spring-orm:5.3.20'

    // Spring Data JPA
    implementation 'org.springframework.data:spring-data-jpa:2.7.0'

    // Hibernate
    implementation 'org.hibernate:hibernate-core:5.6.9.Final'
    implementation 'org.hibernate:hibernate-entitymanager:5.6.9.Final'

    // Database (H2 for in-memory)
    runtimeOnly 'com.h2database:h2:2.1.214'

    // MySQL Connector/J
    runtimeOnly 'mysql:mysql-connector-java:8.0.28' // Added MySQL dependency

    // Servlet API
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'

    // Thymeleaf
    implementation 'org.thymeleaf:thymeleaf-spring5:3.1.2.RELEASE'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.1.0'

    // For testing (optional, but good practice)
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

tasks.named('test') {
    useJUnitPlatform()
}