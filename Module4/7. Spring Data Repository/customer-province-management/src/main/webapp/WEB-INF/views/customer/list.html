<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="/layout :: head">
    <title>List Customer</title>
</head>
<body>
<h3>Customers</h3>
<p>
    <a th:href="@{/customers/create}">
        Add new customer
    </a>
</p>
<p>
    <a th:href="@{/provinces}">
        Provinces
    </a>
</p>
<form th:action="@{/customers}" method="get">
    Search by first name:
    <input name="search" type="text" th:value="${search}"/>
    <input type="submit" value="Search"/>
</form><br/>
<div class="notify">
    <div th:if="${message}">
        <span th:text="${message}"></span>
    </div>
</div>

<table id="customers">
    <thead>
    <tr>
        <th>STT</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Province</th>
        <th>Update</th>
        <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c, cStatus : ${customers}">
        <td th:text="${(customers.number * customers.size) + cStatus.index + 1}"></td>
        <td th:text="${c.getFirstName()}"></td>
        <td th:text="${c.getLastName()}"></td>
        <td th:if="${c.getProvince()}" th:text="${c.getProvince().getName()}"></td>
        <td th:unless="${c.getProvince()}"></td>
        <td><a th:href="@{/customers/update/{id}(id=${c.getId()})}">update</a></td>
        <td><a th:href="@{/customers/delete/{id}(id=${c.getId()})}">delete</a></td>
    </tr>
    </tbody>
</table>
<div>
    <a th:if="${customers.hasPrevious()}" th:href="@{/customers(page=${customers.number - 1})}">Previous</a>
    <span>&nbsp;</span>
    <span th:each="pageNumber : ${#numbers.sequence(0, customers.totalPages - 1)}">
        <a th:href="@{/customers(page=${pageNumber})}" th:text="${pageNumber + 1}"></a>
        <span>&nbsp;</span>
    </span>
    <a th:if="${customers.hasNext()}" th:href="@{/customers(page=${customers.number + 1})}">Next</a>
</div>
<footer th:replace="/layout :: footer"></footer>
</body>
</html>
